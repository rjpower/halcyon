# Multi-app manifest. `bin/sync` reads this; `bin/new` appends to it.
#
# Per app:
#   dir       checkout directory, relative to the halcyon root (default: the key)
#   repo      git URL — only used to clone `dir` when it doesn't exist yet. The
#             checkout, not the remote, is what gets built and shipped.
#   branch    branch to clone at
#   container container_name from the app's own docker-compose.yml
#   port      the port that container listens on
#   hosts     hostnames Caddy serves it under. `bin/sync` asserts Caddy really
#             is serving each one; `bin/new` writes the vhost block.
#
# loom (weaver.rjp.io, loom.rjp.io) is deliberately absent: it is deployed out
# of band, from its own checkout. `bin/sync` will list its hosts as unmanaged.

[apps.blog]
dir       = "blog"
repo      = "git@github.com:rjpower/blog.git"
branch    = "main"
container = "blog"
port      = 8000
hosts     = ["rjp.io", "www.rjp.io", "taco.rjp.io"]

[apps.kana-quiz]
dir       = "kana-quiz"
repo      = "git@github.com:rjpower/kana-quiz.git"
branch    = "main"
container = "kana-quiz"
port      = 8000
hosts     = ["kana.rjp.io"]

# notes and feedbot moved to hyperbase 2026-07-27. Their hostnames are served by
# hyperbase's gateway; leaving the entries here would have `bin/sync` rebuild and
# restart containers nothing routes to.

# spillbench was retired 2026-07-20: its report moved into the blog. The host
# spillbench.rjp.io stays in the Caddyfile as a redirect (unmanaged, like loom).
