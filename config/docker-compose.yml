name: caddy

services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Compose defaults a bare "443:443" to TCP, but caddy serves HTTP/3 out of
      # the box and advertises it to every client as `alt-svc: h3=":443"`. Without
      # this line the udp socket is only *exposed*, never bound to the host, so
      # browsers get pointed at a path that silently drops their packets. QUIC
      # also keys a connection to a connection ID rather than the IP 4-tuple, so
      # publishing it is what lets a phone survive a wifi<->cellular handoff
      # without dropping in-flight requests. Needs `ufw allow 443/udp` too.
      - "443:443/udp"
    volumes:
      # The *directory*, not ./caddy/Caddyfile itself. A single-file bind mount
      # pins the file's inode at container start, and every editor rewrites a
      # file as a new inode — so caddy would go on reading the original forever
      # while `caddy reload` reported success. Mounting the parent means a path
      # lookup on each read, and edits are simply visible.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
